name: Build Valheim Server Docker Images

on:
  push:
    branches: [dev, main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'README.md'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/teriyakidactyl/docker-valheim-server
  BASE_REGISTRY_IMAGE: ghcr.io/teriyakidactyl/docker-steamcmd-server
  MATRIX_BASE_TAGS: |
    bookworm
    trixie
  MATRIX_PLATFORMS: |
    linux/amd64
    linux/arm64

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gettext-base
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: Test Valheim contracts
        run: |
          for test_script in tests/test_*.sh; do
            bash "$test_script"
          done
      - name: Validate Compose
        run: docker compose config >/dev/null

  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base-tags: ${{ steps.set-matrix.outputs.base-tags }}
      platforms: ${{ steps.set-matrix.outputs.platforms }}
    steps:
      - id: set-matrix
        run: |
          BASE_TAGS=$(echo '${{ env.MATRIX_BASE_TAGS }}' | grep -v '^$' | awk '{print "\""$0"\""}' | paste -sd, | awk '{print "["$0"]"}')
          PLATFORMS=$(echo '${{ env.MATRIX_PLATFORMS }}' | grep -v '^$' | awk '{print "\""$0"\""}' | paste -sd, | awk '{print "["$0"]"}')
          echo "base-tags=$BASE_TAGS" >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

  build:
    needs: [quality, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        base_tag: ${{ fromJson(needs.setup.outputs.base-tags) }}
        platform: ${{ fromJson(needs.setup.outputs.platforms) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare tag variables
        run: |
          ARCHITECTURE=$(echo '${{ matrix.platform }}' | cut -d'/' -f2)
          echo "ARCHITECTURE=$ARCHITECTURE" >> "$GITHUB_ENV"
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            BASE_BRANCH_SUFFIX="_dev"
          else
            BASE_BRANCH_SUFFIX=""
          fi
          echo "BASE_BRANCH_SUFFIX=$BASE_BRANCH_SUFFIX" >> "$GITHUB_ENV"
          echo "BASE_TAG=${{ matrix.base_tag }}$BASE_BRANCH_SUFFIX" >> "$GITHUB_ENV"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "VERSIONED_TAG=${{ matrix.base_tag }}-$ARCHITECTURE" >> "$GITHUB_ENV"
            if [[ "${{ matrix.base_tag }}" == "bookworm" ]]; then
              echo "LATEST_ARCH_TAG=latest-$ARCHITECTURE" >> "$GITHUB_ENV"
            else
              echo "LATEST_ARCH_TAG=" >> "$GITHUB_ENV"
            fi
          else
            echo "VERSIONED_TAG=${{ matrix.base_tag }}_dev-$ARCHITECTURE" >> "$GITHUB_ENV"
            echo "LATEST_ARCH_TAG=" >> "$GITHUB_ENV"
          fi
          echo "BRANCH_TAG=${{ github.ref_name }}-$ARCHITECTURE" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ env.BRANCH_TAG }}
            type=raw,value=${{ env.VERSIONED_TAG }}
            ${{ env.LATEST_ARCH_TAG != '' && format('type=raw,value={0}', env.LATEST_ARCH_TAG) || '' }}
          labels: |
            org.opencontainers.image.title=Valheim Server Docker Image
            org.opencontainers.image.description=Docker image for Valheim dedicated server based on docker-steamcmd-server
            org.opencontainers.image.vendor=TeriyakiDactyl
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.example.git.branch=${{ github.ref_name }}
            com.example.base.image=${{ env.BASE_REGISTRY_IMAGE }}:${{ env.BASE_TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.base_tag }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.base_tag }}-${{ matrix.platform }},mode=max

  create-manifest:
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        base_tag: ${{ fromJson(needs.setup.outputs.base-tags) }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate manifest tag names
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "MANIFEST_TAG=${{ matrix.base_tag }}" >> "$GITHUB_ENV"
            if [[ "${{ matrix.base_tag }}" == "bookworm" ]]; then
              echo "LATEST_TAG=latest" >> "$GITHUB_ENV"
              echo "HAS_LATEST_TAG=true" >> "$GITHUB_ENV"
            else
              echo "HAS_LATEST_TAG=false" >> "$GITHUB_ENV"
            fi
          else
            echo "MANIFEST_TAG=${{ matrix.base_tag }}_dev" >> "$GITHUB_ENV"
            echo "HAS_LATEST_TAG=false" >> "$GITHUB_ENV"
          fi
      - name: Create and push multi-architecture manifests
        run: |
          docker buildx imagetools create --tag "${{ env.REGISTRY_IMAGE }}:${{ env.MANIFEST_TAG }}"             "${{ env.REGISTRY_IMAGE }}:${{ matrix.base_tag }}${{ github.ref == 'refs/heads/main' && '' || '_dev' }}-amd64"             "${{ env.REGISTRY_IMAGE }}:${{ matrix.base_tag }}${{ github.ref == 'refs/heads/main' && '' || '_dev' }}-arm64"
          if [[ "${{ env.HAS_LATEST_TAG }}" == "true" ]]; then
            docker buildx imagetools create --tag "${{ env.REGISTRY_IMAGE }}:${{ env.LATEST_TAG }}"               "${{ env.REGISTRY_IMAGE }}:latest-amd64"               "${{ env.REGISTRY_IMAGE }}:latest-arm64"
          fi

  notify:
    needs: [create-manifest]
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Report workflow status
        run: |
          if [[ "${{ needs.create-manifest.result }}" == "success" ]]; then
            echo "::notice::Docker images successfully built and pushed"
          else
            echo "::error::Failed to build or push some Docker images"
            exit 1
          fi
